<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; padding: 16px; background: #fff; display: inline-block; }</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
<div id="c"></div>
<script>
const code = "%% title: Database Entity Relationship Diagram (ERD)\nerDiagram\n  organizations ||--o{ users : employs\n  organizations ||--o{ subscriptions : holds\n  subscriptions ||--o{ payment_transactions : settles\n  organizations ||--o{ drones : owns\n  organizations ||--o{ drone_leases : contracts\n  platform_drones ||--o{ drone_leases : leased_via\n  drone_leases ||--o| drones : provisions\n  users ||--o{ drone_leases : requests\n  organizations ||--o{ assets : owns\n  asset_categories ||--o{ assets : categorizes\n  assets ||--o{ asset_documents : attaches\n  organizations ||--o{ audit_events : records\n  organizations ||--o{ notifications : scopes\n  users ||--o{ notifications : receives\n  users ||--o{ auth_sessions : opens\n  organizations ||--o{ inspections : owns\n  assets ||--o{ inspections : undergoes\n  users ||--o{ inspections : assigned_inspector\n  drones ||--o{ inspections : assigned_drone\n  organizations ||--o{ recurring_inspection_schedules : schedules\n  assets ||--o{ recurring_inspection_schedules : recurs_for\n  users ||--o{ recurring_inspection_schedules : default_inspector\n  drones ||--o{ recurring_inspection_schedules : default_drone\n  recurring_inspection_schedules ||--o{ schedule_occurrences : generates\n  organizations ||--o{ schedule_occurrences : scopes\n  inspections |o--o{ schedule_occurrences : fulfills\n  recurring_inspection_schedules ||--o{ inspections : dispatches\n  inspections ||--o{ field_sessions : executes\n  inspections ||--o{ evidence : contains\n  field_sessions ||--o{ evidence : captures\n  inspections ||--o{ findings : records\n  evidence ||--o{ findings : locates\n  inspections ||--o{ inspection_reports : delivers\n  organizations ||--o{ maintenance_work_orders : owns\n  assets ||--o{ maintenance_work_orders : remediates\n  users ||--o{ maintenance_work_orders : governs\n  findings ||--o{ maintenance_work_orders : initiates\n  inspection_reports ||--o{ maintenance_work_orders : references\n  maintenance_work_orders ||--o{ maintenance_team_members : deploys\n  maintenance_work_orders ||--o{ maintenance_tasks : deconstructs\n  maintenance_work_orders ||--o{ maintenance_estimate_versions : projects\n  maintenance_estimate_versions ||--o{ maintenance_cost_lines : itemizes\n  maintenance_tasks ||--o{ maintenance_cost_lines : accrues\n  maintenance_work_orders ||--o{ maintenance_change_orders : requests\n  maintenance_tasks ||--o{ maintenance_work_logs : tracks\n  maintenance_work_orders ||--o{ maintenance_reports : delivers\n  maintenance_reports ||--o{ maintenance_acceptance_decisions : accepts\n  organizations {\n    uuid id PK\n    uuid created_by_user_id FK\n    timestamptz created_at\n    timestamptz updated_at\n    varchar legal_name\n    varchar display_name\n    varchar registration_code\n    varchar timezone\n    varchar status\n    bigint row_version\n  }\n  users {\n    uuid id PK\n    uuid organization_id FK\n    varchar email\n    varchar normalized_email\n    varchar full_name\n    varchar password_hash\n    varchar status\n    varchar actor_zone\n    integer auth_version\n    integer failed_login_count\n    timestamptz lockout_until\n    boolean must_change_password\n    timestamptz last_login_at\n    varchar last_login_ip\n    timestamptz created_at\n    timestamptz updated_at\n    boolean vision_fallback_enabled\n    varchar phone_number\n    varchar avatar_url\n    varchar roles\n    varchar pilot_license_number\n    varchar pilot_license_class\n    timestamptz pilot_license_expires_at\n    varchar pilot_license_file_key\n  }\n  auth_sessions {\n    uuid id PK\n    uuid user_id FK\n    varchar client_type\n    varchar token_hash\n    varchar previous_token_hash\n    timestamptz issued_at\n    timestamptz expires_at\n    timestamptz revoked_at\n    varchar revoked_reason\n  }\n  subscriptions {\n    uuid id PK\n    uuid organization_id FK\n    uuid confirmed_by_user_id FK\n    varchar plan_code\n    integer billing_period_months\n    numeric agreed_amount_usd\n    varchar status\n    timestamptz starts_at\n    timestamptz ends_at\n    varchar external_reference\n    jsonb terms_snapshot\n    timestamptz confirmed_at\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  payment_transactions {\n    uuid id PK\n    uuid subscription_id FK\n    varchar paypal_order_id\n    varchar paypal_capture_id\n    numeric amount\n    varchar currency\n    varchar status\n    varchar payer_email\n    timestamptz captured_at\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  platform_drones {\n    uuid id PK\n    varchar serial_number\n    varchar model\n    varchar manufacturer\n    jsonb payload_metadata\n    numeric monthly_rate_usd\n    varchar status\n    varchar notes\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  drone_leases {\n    uuid id PK\n    uuid platform_drone_id FK\n    uuid organization_id FK\n    uuid customer_drone_id FK\n    uuid requested_by_user_id FK\n    uuid confirmed_by_user_id FK\n    integer lease_period_months\n    numeric monthly_rate_usd\n    numeric agreed_amount_usd\n    varchar status\n    timestamptz starts_at\n    timestamptz ends_at\n    timestamptz reclaimed_at\n    varchar external_reference\n    varchar paypal_order_id\n    varchar paypal_capture_id\n    timestamptz confirmed_at\n    varchar notes\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  drones {\n    uuid id PK\n    uuid organization_id FK\n    uuid lease_id FK\n    varchar serial_number\n    varchar model\n    varchar manufacturer\n    jsonb payload_metadata\n    varchar serviceability\n    timestamptz last_maintenance_at\n    timestamptz next_maintenance_at\n    varchar notes\n    varchar registration_number\n    varchar registration_file_key\n    timestamptz registration_expires_at\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n    varchar ownership_type\n    timestamptz lease_expires_at\n  }\n  asset_categories {\n    uuid id PK\n    varchar code\n    varchar name\n    varchar description\n    boolean active\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  assets {\n    uuid id PK\n    uuid organization_id FK\n    uuid category_id FK\n    varchar name\n    varchar description\n    numeric latitude\n    numeric longitude\n    varchar status\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n    varchar asset_code\n    jsonb location\n    jsonb technical_profile\n    jsonb inspection_items\n  }\n  asset_documents {\n    uuid id PK\n    uuid asset_id FK\n    uuid uploaded_by_user_id FK\n    varchar document_type\n    varchar file_name\n    varchar content_type\n    bigint size_bytes\n    character checksum_sha256\n    varchar object_key\n    date document_date\n    timestamptz created_at\n  }\n  recurring_inspection_schedules {\n    uuid id PK\n    uuid organization_id FK\n    uuid asset_id FK\n    uuid created_by_user_id FK\n    uuid inspector_id FK\n    uuid drone_id FK\n    timestamp anchor_date\n    varchar timezone\n    varchar recurrence_unit\n    integer recurrence_interval\n    bigint duration_seconds\n    integer reminder_days\n    timestamptz ends_at\n    bigint next_occurrence\n    varchar status\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  schedule_occurrences {\n    uuid id PK\n    uuid schedule_id FK\n    uuid organization_id FK\n    uuid inspection_id FK\n    bigint occurrence_index\n    varchar occurrence_key\n    timestamptz planned_start_at\n    timestamptz planned_end_at\n    varchar status\n    varchar blocked_reason\n    integer retry_count\n    timestamptz reminder_sent_at\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  inspections {\n    uuid id PK\n    uuid asset_id FK\n    uuid organization_id FK\n    uuid inspector_id FK\n    uuid drone_id FK\n    uuid recurring_schedule_id FK\n    varchar status\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n    timestamptz planned_start_at\n    timestamptz planned_end_at\n    varchar flight_permit_file_key\n    varchar flight_permit_file_name\n    timestamptz flight_permit_uploaded_at\n    timestamptz findings_confirmed_at\n    varchar findings_snapshot_hash\n  }\n  field_sessions {\n    uuid id PK\n    uuid inspection_id FK\n    varchar status\n    timestamptz started_at\n    timestamptz ended_at\n    varchar postponement_reason\n    varchar abort_reason\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n    varchar pre_flight_checklist_note\n    varchar outcome_notes\n  }\n  evidence {\n    uuid id PK\n    uuid inspection_id FK\n    uuid field_session_id FK\n    varchar file_name\n    varchar content_type\n    bigint size_bytes\n    varchar object_key\n    timestamptz capture_time\n    numeric latitude\n    numeric longitude\n    varchar location_description\n    boolean is_deleted\n    timestamptz created_at\n  }\n  findings {\n    uuid id PK\n    uuid inspection_id FK\n    uuid evidence_id FK\n    varchar finding_code\n    varchar defect_label\n    varchar severity\n    jsonb bounding_box\n    varchar technical_notes\n    varchar recommended_action\n    varchar status\n    varchar model_name\n    numeric confidence\n    timestamptz forwarded_to_maintenance_at\n    boolean is_deleted\n    timestamptz created_at\n  }\n  inspection_reports {\n    uuid id PK\n    uuid inspection_id FK\n    uuid reviewer_user_id FK\n    integer version_no\n    varchar status\n    jsonb content_snapshot\n    timestamptz submitted_at\n    timestamptz reviewed_at\n    varchar return_reason\n    varchar rendered_object_key\n    character rendered_checksum_sha256\n    timestamptz published_at\n    timestamptz created_at\n  }\n  repair_knowledge_chunks {\n    uuid id PK\n    varchar standard_code\n    varchar title\n    varchar category\n    varchar defect_patterns\n    text content\n    varchar reference_url\n    timestamptz created_at\n  }\n  notifications {\n    uuid id PK\n    uuid recipient_user_id FK\n    uuid organization_id FK\n    varchar event_type\n    varchar channel\n    varchar title\n    varchar body\n    varchar target_path\n    varchar status\n    integer attempt_count\n    varchar last_error_code\n    timestamptz sent_at\n    timestamptz read_at\n    timestamptz created_at\n    varchar aggregate_type\n    uuid aggregate_id\n    varchar deduplication_key\n  }\n  audit_events {\n    uuid id PK\n    uuid organization_id FK\n    uuid actor_user_id FK\n    varchar action\n    varchar aggregate_type\n    uuid aggregate_id\n    varchar before_status\n    varchar after_status\n    bigint aggregate_version\n    varchar reason\n    varchar trace_id\n    jsonb safe_metadata\n    timestamptz created_at\n  }\n  event_publication {\n    uuid id PK\n    text listener_id\n    text event_type\n    text serialized_event\n    timestamptz publication_date\n    timestamptz completion_date\n    text status\n    integer completion_attempts\n    timestamptz last_resubmission_date\n  }\n  maintenance_work_orders {\n    uuid id PK\n    uuid organization_id FK\n    uuid asset_id FK\n    uuid source_report_version_id FK\n    uuid source_finding_id FK\n    uuid owner_user_id FK\n    uuid budget_approver_user_id FK\n    uuid team_lead_user_id FK\n    uuid report_author_user_id FK\n    uuid accepting_reviewer_user_id FK\n    varchar status\n    varchar priority\n    timestamptz due_at\n    varchar corrective_scope\n    varchar acceptance_criteria\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  maintenance_team_members {\n    uuid id PK\n    uuid work_order_id FK\n    uuid engineer_user_id FK\n    uuid assigned_by_user_id FK\n    varchar member_role\n    timestamptz effective_from\n    timestamptz effective_until\n    varchar reason\n    boolean active\n    timestamptz created_at\n  }\n  maintenance_tasks {\n    uuid id PK\n    uuid work_order_id FK\n    uuid assigned_engineer_user_id FK\n    integer task_number\n    varchar name\n    varchar method\n    timestamptz planned_start_at\n    timestamptz planned_end_at\n    varchar acceptance_criteria\n    varchar status\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  maintenance_estimate_versions {\n    uuid id PK\n    uuid work_order_id FK\n    uuid prepared_by_user_id FK\n    uuid approved_by_user_id FK\n    integer version_no\n    varchar status\n    timestamptz approved_at\n    character currency\n    numeric baseline_total\n    varchar assumptions\n    timestamptz created_at\n  }\n  maintenance_cost_lines {\n    uuid id PK\n    uuid work_order_id FK\n    uuid estimate_version_id FK\n    uuid task_id FK\n    uuid entered_by_user_id FK\n    varchar line_kind\n    varchar state\n    varchar description\n    numeric quantity\n    varchar unit\n    numeric unit_rate\n    numeric amount\n    character currency\n    timestamptz created_at\n  }\n  maintenance_change_orders {\n    uuid id PK\n    uuid work_order_id FK\n    uuid requested_by_user_id FK\n    uuid decided_by_user_id FK\n    integer change_number\n    varchar reason\n    numeric proposed_delta\n    varchar status\n    timestamptz decided_at\n    varchar decision_reason\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  maintenance_work_logs {\n    uuid id PK\n    uuid work_order_id FK\n    uuid task_id FK\n    uuid engineer_user_id FK\n    timestamptz started_at\n    timestamptz ended_at\n    numeric hours\n    varchar as_left_condition\n    varchar test_readings\n    varchar status\n    timestamptz created_at\n    timestamptz updated_at\n    bigint row_version\n  }\n  maintenance_reports {\n    uuid id PK\n    uuid work_order_id FK\n    integer version_no\n    varchar status\n    timestamptz author_verified_at\n    text content_snapshot\n    varchar rendered_object_key\n    character rendered_checksum_sha256\n    timestamptz created_at\n  }\n  maintenance_acceptance_decisions {\n    uuid id PK\n    uuid work_order_id FK\n    uuid report_version_id FK\n    uuid reviewer_user_id FK\n    varchar decision\n    varchar technical_comments\n    varchar acceptance_checklist\n    varchar test_result\n    timestamptz decided_at\n  }";
mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  securityLevel: 'loose',
  maxTextSize: 500000,
  er: { useMaxWidth: false }
});
mermaid.render('erd_svg', code).then(({ svg }) => {
  document.getElementById('c').innerHTML = svg;
  const svgEl = document.querySelector('#c svg');
  const cols = [
    ['organizations', 'users', 'auth_sessions', 'subscriptions', 'payment_transactions'],
    ['platform_drones', 'drone_leases', 'drones', 'asset_categories', 'asset_documents'],
    ['assets', 'recurring_inspection_schedules', 'schedule_occurrences', 'notifications', 'audit_events'],
    ['inspections', 'field_sessions', 'evidence', 'findings', 'event_publication'],
    ['inspection_reports', 'maintenance_work_orders', 'maintenance_team_members', 'maintenance_tasks', 'maintenance_estimate_versions'],
    ['maintenance_cost_lines', 'maintenance_change_orders', 'maintenance_work_logs', 'maintenance_reports', 'maintenance_acceptance_decisions', 'repair_knowledge_chunks'],
  ];
  const nodeMap = {};
  svgEl.querySelectorAll('g.node').forEach(n => {
    const id = n.id || '';
    const m = id.match(/entity-([a-z0-9_]+)-\d+$/);
    if (m) {
      const outer = n.querySelector('g.outer-path path');
      const d = outer ? outer.getAttribute('d') : '';
      const dm = d.match(/^M([-\d.]+)\s+([-\d.]+)\s+L([-\d.]+)\s+([-\d.]+)\s+L([-\d.]+)\s+([-\d.]+)/);
      const w = dm ? Math.abs(parseFloat(dm[3]) - parseFloat(dm[1])) : 320;
      const h = dm ? Math.abs(parseFloat(dm[6]) - parseFloat(dm[2])) : 200;
      nodeMap[m[1]] = { el: n, w, h };
    }
  });
  let curX = 32, colGap = 56, rowGap = 32, maxH = 0;
  cols.forEach((colTables, cIdx) => {
    const colW = Math.max(...colTables.map(t => nodeMap[t] ? nodeMap[t].w : 300));
    let curY = 32;
    colTables.forEach((t, rIdx) => {
      const info = nodeMap[t];
      if (!info) return;
      const cx = curX + colW / 2, cy = curY + info.h / 2;
      Object.assign(info, { cx, cy, col: cIdx, row: rIdx, left: cx - info.w / 2, right: cx + info.w / 2, top: cy - info.h / 2, bottom: cy + info.h / 2 });
      info.el.setAttribute('transform', 'translate(' + cx + ', ' + cy + ')');
      curY += info.h + rowGap;
    });
    if (curY > maxH) maxH = curY;
    curX += colW + colGap;
  });
  const totalW = Math.ceil(curX - colGap + 32), totalH = Math.ceil(maxH + 16);
  const edgeLabels = svgEl.querySelectorAll('g.edgeLabels g.edgeLabel');
  svgEl.querySelectorAll('g.edgePaths path.relationshipLine').forEach((p, idx) => {
    const did = p.getAttribute('data-id') || p.id || '';
    const m = did.match(/entity-([a-z0-9_]+)-\d+_entity-([a-z0-9_]+)-\d+/);
    if (m && nodeMap[m[1]] && nodeMap[m[2]]) {
      const a = nodeMap[m[1]], b = nodeMap[m[2]], offset = ((idx % 7) - 3) * 5;
      if (a.col === b.col) {
        const x1 = a.cx + offset, x2 = b.cx + offset;
        const y1 = a.cy < b.cy ? a.bottom : a.top, y2 = a.cy < b.cy ? b.top : b.bottom;
        p.setAttribute('d', 'M' + x1 + ',' + y1 + ' L' + x2 + ',' + y2);
        if (edgeLabels[idx]) {
          if (Math.abs(a.row - b.row) === 1) edgeLabels[idx].setAttribute('transform', 'translate(' + ((x1+x2)/2) + ', ' + ((y1+y2)/2) + ')');
          else edgeLabels[idx].style.display = 'none';
        }
      } else {
        const dir = a.cx < b.cx ? 1 : -1;
        const x1 = dir > 0 ? a.right : a.left, y1 = a.cy + offset;
        const x2 = dir > 0 ? b.left : b.right, y2 = b.cy + offset;
        const mx = x1 + dir * (colGap / 2) + offset;
        p.setAttribute('d', 'M' + x1 + ',' + y1 + ' L' + mx + ',' + y1 + ' L' + mx + ',' + y2 + ' L' + x2 + ',' + y2);
        if (edgeLabels[idx]) edgeLabels[idx].style.display = 'none';
      }
    }
  });
  svgEl.setAttribute('width', String(totalW));
  svgEl.setAttribute('height', String(totalH));
  svgEl.setAttribute('viewBox', '0 0 ' + totalW + ' ' + totalH);
  document.body.setAttribute('data-ready', '1');
});
</script>
</body>
</html>
