rts {\n    _ id PK\n    _ inspection_id FK\n    _ reviewer_user_id FK\n    _ version_no\n    _ status\n    _ content_snapshot\n    _ submitted_at\n    _ reviewed_at\n    _ return_reason\n    _ rendered_object_key\n    _ rendered_checksum_sha256\n    _ published_at\n    _ created_at\n  }\n  repair_knowledge_chunks {\n    _ id PK\n    _ standard_code\n    _ title\n    _ category\n    _ defect_patterns\n    _ content\n    _ reference_url\n    _ created_at\n  }\n  notifications {\n    _ id PK\n    _ recipient_user_id FK\n    _ organization_id FK\n    _ event_type\n    _ channel\n    _ title\n    _ body\n    _ target_path\n    _ status\n    _ attempt_count\n    _ last_error_code\n    _ sent_at\n    _ read_at\n    _ created_at\n    _ aggregate_type\n    _ aggregate_id\n    _ deduplication_key\n  }\n  audit_events {\n    _ id PK\n    _ organization_id FK\n    _ actor_user_id FK\n    _ action\n    _ aggregate_type\n    _ aggregate_id\n    _ before_status\n    _ after_status\n    _ aggregate_version\n    _ reason\n    _ trace_id\n    _ safe_metadata\n    _ created_at\n  }\n  event_publication {\n    _ id PK\n    _ listener_id\n    _ event_type\n    _ serialized_event\n    _ publication_date\n    _ completion_date\n    _ status\n    _ completion_attempts\n    _ last_resubmission_date\n  }\n  maintenance_work_orders {\n    _ id PK\n    _ organization_id FK\n    _ asset_id FK\n    _ source_report_version_id FK\n    _ source_finding_id FK\n    _ owner_user_id FK\n    _ budget_approver_user_id FK\n    _ team_lead_user_id FK\n    _ report_author_user_id FK\n    _ accepting_reviewer_user_id FK\n    _ status\n    _ priority\n    _ due_at\n    _ corrective_scope\n    _ acceptance_criteria\n    _ created_at\n    _ updated_at\n    _ row_version\n  }\n  maintenance_team_members {\n    _ id PK\n    _ work_order_id FK\n    _ engineer_user_id FK\n    _ assigned_by_user_id FK\n    _ member_role\n    _ effective_from\n    _ effective_until\n    _ reason\n    _ active\n    _ created_at\n  }\n  maintenance_tasks {\n    _ id PK\n    _ work_order_id FK\n    _ assigned_engineer_user_id FK\n    _ task_number\n    _ name\n    _ method\n    _ planned_start_at\n    _ planned_end_at\n    _ acceptance_criteria\n    _ status\n    _ created_at\n    _ updated_at\n    _ row_version\n  }\n  maintenance_estimate_versions {\n    _ id PK\n    _ work_order_id FK\n    _ prepared_by_user_id FK\n    _ approved_by_user_id FK\n    _ version_no\n    _ status\n    _ approved_at\n    _ currency\n    _ baseline_total\n    _ assumptions\n    _ created_at\n  }\n  maintenance_cost_lines {\n    _ id PK\n    _ work_order_id FK\n    _ estimate_version_id FK\n    _ task_id FK\n    _ entered_by_user_id FK\n    _ line_kind\n    _ state\n    _ description\n    _ quantity\n    _ unit\n    _ unit_rate\n    _ amount\n    _ currency\n    _ created_at\n  }\n  maintenance_change_orders {\n    _ id PK\n    _ work_order_id FK\n    _ requested_by_user_id FK\n    _ decided_by_user_id FK\n    _ change_number\n    _ reason\n    _ proposed_delta\n    _ status\n    _ decided_at\n    _ decision_reason\n    _ created_at\n    _ updated_at\n    _ row_version\n  }\n  maintenance_work_logs {\n    _ id PK\n    _ work_order_id FK\n    _ task_id FK\n    _ engineer_user_id FK\n    _ started_at\n    _ ended_at\n    _ hours\n    _ as_left_condition\n    _ test_readings\n    _ status\n    _ created_at\n    _ updated_at\n    _ row_version\n  }\n  maintenance_reports {\n    _ id PK\n    _ work_order_id FK\n    _ version_no\n    _ status\n    _ author_verified_at\n    _ content_snapshot\n    _ rendered_object_key\n    _ rendered_checksum_sha256\n    _ created_at\n  }\n  maintenance_acceptance_decisions {\n    _ id PK\n    _ work_order_id FK\n    _ report_version_id FK\n    _ reviewer_user_id FK\n    _ decision\n    _ technical_comments\n    _ acceptance_checklist\n    _ test_result\n    _ decided_at\n  }";
mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  securityLevel: 'loose',
  maxTextSize: 500000,
  er: { useMaxWidth: false }
});
mermaid.render('erd_svg', code).then(({ svg }) => {
  document.getElementById('c').innerHTML = svg;
  document.querySelectorAll('#c svg g.label.attribute-type').forEach(g => g.remove());
  document.querySelectorAll('#c svg g.node').forEach(node => {
    const divs = node.querySelectorAll('g.divider');
    if (divs.length >= 2) divs[1].remove();
    node.querySelectorAll('g.label.attribute-name').forEach(g => {
      const tf = g.getAttribute('transform') || '';
      const m = tf.match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
      if (m) {
        const outer = node.querySelector('g.outer-path path');
        const d = outer ? outer.getAttribute('d') : '';
        const xm = d.match(/^M([-\d.]+)/);
        const leftX = xm ? parseFloat(xm[1]) + 12 : parseFloat(m[1]);
        g.setAttribute('transform', 'translate(' + leftX + ', ' + m[2] + ')');
      }
    });
  });
  document.body.setAttribute('data-ready', '1');
});
</script>
</body>
